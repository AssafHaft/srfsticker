<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מדבקת מדריך גלישה חיצוני</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800;900&display=swap">
<style>
  /* Layout: black-and-white sticker, 80x50 mm. Black band with the role, big name, thick rule, fixed park logo. */
  :root { --ink: #000; --paper: #fff; --ground: #ececec; --font: "Heebo", "Assistant", "Arial Hebrew", Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); }
  .app { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 22px; font-weight: 900; }
  .stage { background: var(--paper); border: 2px solid var(--ink); padding: 20px; display: grid; place-items: center; }
  .stage svg { width: 100%; max-width: 560px; height: auto; display: block; outline: 1px dashed #888; }
  .size { font-size: 13px; text-align: center; margin-top: 10px; }
  .controls { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  .wide { grid-column: 1 / -1; }
  label { display: grid; gap: 6px; font-weight: 700; font-size: 14px; }
  input, select { font: inherit; font-weight: 500; padding: 10px 12px; border: 2px solid var(--ink); background: #fff; color: var(--ink); border-radius: 0; min-width: 0; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button { font: inherit; font-weight: 700; padding: 11px 22px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 999px; cursor: pointer; justify-self: start; }
  .hint { font-size: 13px; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
<main class="app">
  <h1>מדבקת מדריך גלישה חיצוני · 8×5 ס״מ · שחור-לבן</h1>

  <section class="stage">
    <div id="preview" aria-label="תצוגה מקדימה של המדבקה"></div>
    <div class="size">גודל הדפסה: 80 × 50 מ״מ</div>
  </section>

  <section class="controls">
    <label class="wide">שם המדריך
      <input id="name" type="text" value="עידו כהן" maxlength="24" autocomplete="off">
    </label>
    <label class="wide">תפקיד
      <select id="role">
        <option value="m">מדריך גלישה חיצוני</option>
        <option value="f">מדריכת גלישה חיצונית</option>
      </select>
    </label>
    <label>תאריך הנפקה
      <input id="issued" type="date">
    </label>
    <label>בתוקף עד
      <input id="expires" type="date">
    </label>
    <button id="pngBtn" type="button" class="wide">הורדת PNG</button>
    <p class="hint wide">הקובץ נשמר כ-PNG בשחור-לבן, ברזולוציה 1890×1181 פיקסלים (600 DPI ל-80×50 מ״מ), מוכן לשליחה למכשיר המדבקות. ניתן לשנות את השם, התפקיד, תאריך ההנפקה ותאריך התפוגה.</p>
  </section>
</main>

  var FONT = 'Heebo, Assistant, Arial Hebrew, Arial, sans-serif';

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // Dates sit beside the logo: issue date on the right, expiry on the left. Each entry is [centerX, label, value].
  function dateBlocks(issued, expires) {
    var out = [];
    if (issued) out.push([65, 'תאריך הנפקה', issued]);
    if (expires) out.push([15, 'בתוקף עד', expires]);
    return out;
  }

  function sticker(name, roleText, nameSize, issued, expires) {
    var dates = dateBlocks(issued, expires).map(function (b) {
      return '<text x="' + b[0] + '" y="39.6" text-anchor="middle" direction="rtl" font-family="' + FONT + '" font-weight="800" font-size="2.8" fill="#000">' + esc(b[1]) + '</text>' +
        '<text x="' + b[0] + '" y="45.4" text-anchor="middle" direction="ltr" font-family="' + FONT + '" font-weight="900" font-size="4.4" fill="#000">' + esc(b[2]) + '</text>';
    }).join('');
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50" width="80mm" height="50mm" role="img" aria-label="' + esc(roleText + ' ' + name) + '">' +
      '<rect width="80" height="50" fill="#fff"/>' +
      '<rect x="1.2" y="1.2" width="77.6" height="12.6" fill="#000"/>' +
      '<rect x="1.2" y="1.2" width="77.6" height="47.6" fill="none" stroke="#000" stroke-width="0.9"/>' +
      '<text x="40" y="10.4" text-anchor="middle" direction="rtl" font-family="' + FONT + '" font-weight="800" font-size="7" fill="#fff">' + esc(roleText) + '</text>' +
      '<text class="nm" x="40" y="28.4" text-anchor="middle" direction="rtl" font-family="' + FONT + '" font-weight="900" font-size="' + nameSize + '" fill="#000">' + esc(name) + '</text>' +
      '<rect x="8" y="32.2" width="64" height="0.9" fill="#000"/>' +
      '<image x="22" y="34.6" width="36" height="13.2" preserveAspectRatio="xMidYMid meet" href="' + LOGO + '"/>' +
      dates +
      '</svg>';
  }

  var nameEl = document.getElementById('name');
  var roleEl = document.getElementById('role');
  var issuedEl = document.getElementById('issued');
  var expiresEl = document.getElementById('expires');
  var previewEl = document.getElementById('preview');
  var currentSize = 12;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  // "YYYY-MM-DD" from <input type="date"> -> "DD.MM.YYYY"; parsed by hand to avoid timezone shifts.
  function fmtDate(v) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    return m ? m[3] + '.' + m[2] + '.' + m[1] : '';
  }

  var today = new Date();
  var nextYear = new Date(today.getFullYear() + 1, today.getMonth(), today.getDate());
  issuedEl.value = isoDate(today);
  expiresEl.value = isoDate(nextYear);
  expiresEl.min = issuedEl.value;

  function current() {
    return {
      name: nameEl.value.trim() || 'שם המדריך',
      roleText: roleEl.value === 'f' ? 'מדריכת גלישה חיצונית' : 'מדריך גלישה חיצוני',
      issued: fmtDate(issuedEl.value),
      expires: fmtDate(expiresEl.value)
    };
  }

  function render() {
    var c = current();
    previewEl.innerHTML = sticker(c.name, c.roleText, 12, c.issued, c.expires);
    var t = previewEl.querySelector('.nm');
    var w = t.getBBox().width, maxW = 68;
    currentSize = w > maxW ? Math.max(5, 12 * maxW / w) : 12;
    t.setAttribute('font-size', currentSize.toFixed(2));
  }

  function loadLogo() {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () { res(im); };
      im.onerror = rej;
      im.src = LOGO;
    });
  }

  function makePng(name, roleText, issued, expires) {
    var W = 1890, H = 1181, S = W / 80;
    var fontsReady = (document.fonts && document.fonts.load)
      ? Promise.all([document.fonts.load('900 40px Heebo'), document.fonts.load('800 40px Heebo')]).catch(function () {})
      : Promise.resolve();
    return Promise.all([loadLogo(), fontsReady]).then(function (r) {
      var logo = r[0];
      var cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      var x = cv.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
      x.fillStyle = '#000'; x.fillRect(1.2 * S, 1.2 * S, 77.6 * S, 12.6 * S);
      x.strokeStyle = '#000'; x.lineWidth = 0.9 * S;
      x.strokeRect(1.2 * S, 1.2 * S, 77.6 * S, 47.6 * S);
      x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
      x.fillStyle = '#fff';
      x.font = '800 ' + (7 * S) + 'px ' + FONT;
      x.fillText(roleText, 40 * S, 10.4 * S);
      var size = 12;
      x.font = '900 ' + (size * S) + 'px ' + FONT;
      var w = x.measureText(name).width / S;
      if (w > 68) size = Math.max(5, 12 * 68 / w);
      x.font = '900 ' + (size * S) + 'px ' + FONT;
      x.fillStyle = '#000';
      x.fillText(name, 40 * S, 28.4 * S);
      x.fillRect(8 * S, 32.2 * S, 64 * S, 0.9 * S);
      var bw = 36, bh = 13.2, k = Math.min(bw / logo.width, bh / logo.height);
      var lw = logo.width * k, lh = logo.height * k;
      x.drawImage(logo, (40 - lw / 2) * S, (34.6 + (bh - lh) / 2) * S, lw * S, lh * S);
      dateBlocks(issued, expires).forEach(function (b) {
        x.direction = 'rtl';
        x.font = '800 ' + (2.8 * S) + 'px ' + FONT;
        x.fillText(b[1], b[0] * S, 39.6 * S);
        x.direction = 'ltr';
        x.font = '900 ' + (4.4 * S) + 'px ' + FONT;
        x.fillText(b[2], b[0] * S, 45.4 * S);
      });
      var d = x.getImageData(0, 0, W, H), px = d.data, i, v;
      for (i = 0; i < px.length; i += 4) {
        v = (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) < 140 ? 0 : 255;
        px[i] = px[i + 1] = px[i + 2] = v; px[i + 3] = 255;
      }
      x.putImageData(d, 0, 0);
      return new Promise(function (res) { cv.toBlob(res, 'image/png'); });
    });
  }

  function download() {
    var c = current();
    var btn = document.getElementById('pngBtn');
    btn.disabled = true;
    makePng(c.name, c.roleText, c.issued, c.expires).then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'sticker-' + c.name.replace(/[^A-Za-z0-9֐-׿-]+/g, '_') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    }).catch(function () {
      alert('יצירת הקובץ נכשלה. נסו שוב בדפדפן Chrome או Edge.');
    }).then(function () { btn.disabled = false; });
  }

  nameEl.addEventListener('input', render);
  roleEl.addEventListener('change', render);
  issuedEl.addEventListener('input', function () { expiresEl.min = issuedEl.value; render(); });
  expiresEl.addEventListener('input', render);
  document.getElementById('pngBtn').addEventListener('click', download);
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>
</body>
</html>
